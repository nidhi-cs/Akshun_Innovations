    <path d="M365 339h99" stroke="#527f90" stroke-width="5"/>
    <path d="M654 348h94v107h-72v34h-76" fill="none" stroke="#db7951" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="676" cy="348" r="9" fill="#dc7951"/>
    <text x="695" y="324" fill="#a75a3e" font-family="Arial,sans-serif" font-size="13" font-weight="700">FAULT PATH CONCEPT</text>
    <path d="M411 457h316" stroke="#527f90" stroke-width="5"/>
    <path d="M573 457v32m-45 0h90m-77 14h64m-49 14h34m-22 14h10" stroke="#527f90" stroke-width="4" stroke-linecap="round"/>
    <text x="573" y="548" text-anchor="middle" fill="#526b73" font-family="Arial,sans-serif" font-size="13" font-weight="700">GROUNDING CONCEPT</text>
    <rect x="178" y="446" width="205" height="67" rx="12" fill="#fff7e8" stroke="#e6c78e" stroke-width="2"/>
    <path d="M202 468v22m-12-12 12-12 12 12" fill="none" stroke="#b98a42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="233" y="474" fill="#78633d" font-family="Arial,sans-serif" font-size="12" font-weight="700">SUPERVISED</text>
    <text x="233" y="492" fill="#78633d" font-family="Arial,sans-serif" font-size="12" font-weight="700">SAFETY LEARNING</text>
  </g>
  <text x="480" y="615" text-anchor="middle" fill="#4a5c61" font-family="Arial,sans-serif" font-size="19" font-weight="700">Grounding and protective-path principles</text>
  <text x="480" y="646" text-anchor="middle" fill="#7c7c70" font-family="Arial,sans-serif" font-size="14">Concept diagram only — not instructions for live-fault testing</text>
