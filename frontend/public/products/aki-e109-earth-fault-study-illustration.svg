<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative earth-fault study concept</title>
  <desc id="desc">A conceptual electrical installation diagram traces an earth-fault path to a grounding point for supervised safety education. Not a photograph of AKI-E109.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf7"/><stop offset="1" stop-color="#efece3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3c3b32" flood-opacity=".15"/></filter>
  </defs>
  <rect width="960" height="720" rx="36" fill="url(#bg)"/>
  <rect x="58" y="54" width="308" height="44" rx="22" fill="#fff" stroke="#e2ded2"/>
  <circle cx="84" cy="76" r="7" fill="#dc8650"/>
  <text x="105" y="82" fill="#5b5548" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">ILLUSTRATIVE CONCEPT</text>
  <g filter="url(#shadow)">
    <rect x="101" y="148" width="758" height="420" rx="25" fill="#fff" stroke="#d4d2ca" stroke-width="3"/>
    <rect x="127" y="174" width="706" height="48" rx="12" fill="#455962"/>
    <text x="480" y="205" text-anchor="middle" fill="#f6f7f5" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">EARTH-FAULT PATH • SAFETY STUDY</text>
    <rect x="171" y="272" width="194" height="134" rx="16" fill="#edf2f2" stroke="#a8b7b7" stroke-width="3"/>
    <text x="268" y="301" text-anchor="middle" fill="#435861" font-family="Arial,sans-serif" font-size="14" font-weight="700">SUPPLY CONCEPT</text>
    <path d="M205 348h58m-29-26v52m-16-26h32" stroke="#56717a" stroke-width="4" stroke-linecap="round"/>
    <text x="300" y="354" fill="#6b7e82" font-family="Arial,sans-serif" font-size="13">source</text>
    <rect x="464" y="272" width="190" height="134" rx="16" fill="#f3f4f0" stroke="#b3b8ad" stroke-width="3"/>
    <text x="559" y="301" text-anchor="middle" fill="#435861" font-family="Arial,sans-serif" font-size="14" font-weight="700">EQUIPMENT CASE</text>
    <rect x="504" y="320" width="110" height="57" rx="9" fill="#d6e0df" stroke="#7c9495" stroke-width="3"/>
