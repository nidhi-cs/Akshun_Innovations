<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative pneumatic PLC training panel</title>
  <desc id="desc">A conceptual training panel connects a PLC control area to a pneumatic actuator and cylinder. It is not a photograph of AKI-E192.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8edf1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f6"/>
      <stop offset="1" stop-color="#dce3e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#243447" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="960" height="720" rx="36" fill="url(#bg)"/>
  <rect x="64" y="58" width="300" height="44" rx="22" fill="#fff" stroke="#d7e0e5"/>
  <circle cx="91" cy="80" r="7" fill="#e18143"/>
  <text x="112" y="86" fill="#394a59" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ILLUSTRATIVE CONCEPT</text>
