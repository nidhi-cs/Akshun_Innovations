<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative industrial control loop trainer</title>
  <desc id="desc">Conceptual feedback-loop diagram with controller, process, and measurement path. Not a photograph of AKI-E219.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcfd"/><stop offset="1" stop-color="#e8eff3"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#243746" flood-opacity=".14"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#347f91"/></marker></defs>
  <rect width="960" height="720" rx="36" fill="url(#bg)"/><rect x="58" y="54" width="324" height="44" rx="22" fill="#fff" stroke="#d6e0e8"/><circle cx="84" cy="76" r="7" fill="#347f91"/><text x="105" y="82" fill="#3d5262" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">ILLUSTRATIVE CONCEPT</text>
