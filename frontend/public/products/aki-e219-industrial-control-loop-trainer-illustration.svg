  <rect x="585" y="305" width="145" height="120" rx="16" fill="#edf2f3" stroke="#66828d" stroke-width="5"/><text x="657" y="360" text-anchor="middle" fill="#405c69" font-family="Arial" font-size="17" font-weight="700">PROCESS</text><path d="M615 383h85" stroke="#d8954d" stroke-width="5"/>
