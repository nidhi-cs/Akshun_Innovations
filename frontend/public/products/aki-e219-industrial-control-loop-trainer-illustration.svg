  <rect x="190" y="315" width="145" height="100" rx="16" fill="#edf2f3" stroke="#66828d" stroke-width="5"/><text x="262" y="373" text-anchor="middle" fill="#405c69" font-family="Arial" font-size="17" font-weight="700">SETPOINT</text>
