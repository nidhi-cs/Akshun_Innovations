  <text x="480" y="625" text-anchor="middle" fill="#3d5663" font-family="Arial,sans-serif" font-size="19" font-weight="700">Industrial Control Loop Trainer</text><text x="480" y="655" text-anchor="middle" fill="#71838c" font-family="Arial,sans-serif" font-size="14">Illustration only — not an AKSHUNN product photograph</text>
