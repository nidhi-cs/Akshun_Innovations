<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Solar Charge Controller Trainer</title>
  <desc id="desc">Conceptual learning diagram showing a solar panel, charge-control unit, and battery. Not a photograph of AKI-E221.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#e8eff3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#243746" flood-opacity=".15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#347f91"/>
    </marker>
  </defs>
  <rect width="960" height="720" rx="36" fill="url(#background)"/>
  <rect x="58" y="54" width="324" height="44" rx="22" fill="#fff" stroke="#d6e0e8"/>
  <circle cx="84" cy="76" r="7" fill="#347f91"/>
  <text x="105" y="82" fill="#3d5262" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">ILLUSTRATIVE CONCEPT</text>
  <g filter="url(#shadow)">
    <rect x="115" y="151" width="730" height="420" rx="27" fill="#fff" stroke="#d4dfe4" stroke-width="3"/>
    <rect x="141" y="177" width="678" height="48" rx="13" fill="#304d60"/>
    <text x="480" y="208" text-anchor="middle" fill="#f6f9fb" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">SOLAR CHARGE CONTROL PRINCIPLES</text>
    <g transform="translate(195 300)">
      <path d="M15 40 165 0l42 150-153 42z" fill="#315a71" stroke="#294757" stroke-width="7"/>
      <path d="m65 27 40 142m14-162 41 149M7 82l169-44M23 137l168-45" fill="none" stroke="#91c7d0" stroke-width="6"/>
      <circle cx="172" cy="-17" r="25" fill="#efbd68"/>
      <path d="M172-55v-17m35 32 13-13m-96 13-13-13m111 48h18m-154 0H68" stroke="#e8aa51" stroke-width="5" stroke-linecap="round"/>
      <text x="102" y="234" text-anchor="middle" fill="#425b66" font-family="Arial,sans-serif" font-size="15" font-weight="700">PHOTOVOLTAIC SOURCE</text>
    </g>
    <path d="M415 360h90" fill="none" stroke="#347f91" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(510 305)">
      <rect width="155" height="145" rx="18" fill="#e7eef1" stroke="#587986" stroke-width="6"/>
      <rect x="24" y="22" width="107" height="45" rx="8" fill="#294f61"/>
      <text x="77" y="50" text-anchor="middle" fill="#a0dfbd" font-family="Arial,sans-serif" font-size="13" font-weight="700">CONTROL</text>
      <circle cx="48" cy="98" r="10" fill="#4f9c8f"/>
      <circle cx="78" cy="98" r="10" fill="#d99a52"/>
      <circle cx="108" cy="98" r="10" fill="#6e8790"/>
      <text x="77" y="180" text-anchor="middle" fill="#425b66" font-family="Arial,sans-serif" font-size="14" font-weight="700">CHARGE REGULATION</text>
    </g>
    <path d="M675 360h74" fill="none" stroke="#347f91" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(745 330)">
      <rect x="2" y="18" width="76" height="118" rx="12" fill="#dfe8eb" stroke="#587986" stroke-width="5"/>
      <rect x="25" y="7" width="30" height="12" rx="4" fill="#78909a"/>
      <path d="M40 45v58m-22-29h44" stroke="#3f8792" stroke-width="8" stroke-linecap="round"/>
      <text x="40" y="167" text-anchor="middle" fill="#425b66" font-family="Arial,sans-serif" font-size="14" font-weight="700">BATTERY</text>
    </g>
  </g>
  <text x="480" y="625" text-anchor="middle" fill="#3d5663" font-family="Arial,sans-serif" font-size="19" font-weight="700">Solar Charge Controller Trainer</text>
  <text x="480" y="655" text-anchor="middle" fill="#71838c" font-family="Arial,sans-serif" font-size="14">Illustration only — not an AKSHUNN product photograph</text>
</svg>
