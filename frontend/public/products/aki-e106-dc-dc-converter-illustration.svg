    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#276d5f"/><stop offset="1" stop-color="#174b49"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#203b38" flood-opacity=".17"/></filter>
  </defs>
