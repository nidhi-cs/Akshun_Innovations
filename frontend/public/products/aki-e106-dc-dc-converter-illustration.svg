<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative DC-to-DC converter training concept</title>
  <desc id="desc">A conceptual circuit board shows a DC input, switching stage, and regulated-output concept. Not a photograph of AKI-E106.</desc>
